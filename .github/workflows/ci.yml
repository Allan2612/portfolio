name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled in Playwright's image (same version as
    # @playwright/test). Installing them per run meant ~140 MB from apt and once took 24 minutes.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 20
    env:
      # Private list of terms the site must never contain (see README, "Content guard").
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
      # Firefox refuses to start in the container unless HOME points at root's home.
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:banned
      - run: pnpm test:e2e
